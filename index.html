<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Profissional - Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; overflow-x: hidden; }
        
        #reader { 
            width: 100% !important;
            max-width: 400px; 
            border-radius: 8px;
        }

        .oculto { display: none !important; }
    
        @media (min-width: 768px) {
            .row.g-3 {
                min-height: 85vh; 
                align-items: stretch; 
            }
            
            .carrinho-container {
                flex-grow: 1; 
                height: calc(100vh - 420px); 
                min-height: 200px;
                overflow-y: auto;
            }
        }
    
        .painel-pagamento {
            background: #f1f3f5;
            padding: 10px; 
            border-radius: 8px;
            border-top: 2px solid #dee2e6;
            margin-top: 5px; 
        }
    
        .item-card { 
            border-left: 4px solid #0d6efd; 
            margin-bottom: 2px !important; 
            padding: 4px 10px !important; 
        }

        .item-card strong {
            white-space: nowrap !important;
        }
    
        .item-nome {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
            font-size: 0.85rem;
        }

        .item-tamanho {
            font-size: 0.75rem;
            color: #6c757d;
            font-weight: bold;
        }
    
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center;
        }

        /* Estilo para a barra de avisos superior */
        #containerAvisos {
            position: fixed;
            top: 20px; /* Desci um pouco mais para não colar no topo */
            left: 50%;
            transform: translateX(-50%);
            z-index: 30000; /* Valor maior que a tela de acesso e loaders */
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

<!-- Espaço para Avisos (Sucesso/Erro) -->
<div id="containerAvisos"></div>

<div class="loading-overlay" id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <span class="ms-2" id="loaderText">Sincronizando Dados...</span>
</div>

<!-- Tela de Acesso -->
<div id="telaAcesso" class="d-flex justify-content-center align-items-center" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #f8f9fa; z-index: 20000;">
    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 90%;">
        <h3 class="mb-4 text-primary">Acesso ao PDV GARBO</h3>
        <div class="mb-3 text-start">
            <label class="form-label fw-bold">Nome do Vendedor</label>
            <input type="text" id="vendedorAtivo" class="form-control form-control-lg" placeholder="Digite seu nome">
        </div>
        <button class="btn btn-primary btn-lg w-100 py-3" onclick="iniciarSistema()">
            ENTRAR E ATIVAR PDV ⛶
        </button>
        <p class="mt-3 text-muted small">O sistema será aberto em tela cheia.</p>
    </div>
</div>
    
<div class="container-fluid py-3 oculto" id="conteudoPrincipal">
    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100 d-flex align-items-center justify-content-center">
                <div class="card-body text-center w-100 d-flex flex-column justify-content-center">
                    <h5 class="card-title mb-3">Terminal de Leitura</h5>
                    <div id="reader" class="mx-auto"></div>
                    <div class="mt-3">
                        <div class="input-group input-group-sm mx-auto" style="max-width: 300px;">
                            <input type="text" id="manualInput" class="form-control" 
                               placeholder="Código manual" 
                               inputmode="none"
                               style="text-transform: uppercase;" 
                               oninput="this.value = this.value.toUpperCase()"
                               onkeydown="if(event.key === 'Enter') buscarPorCodigo(this.value)">
                            <button class="btn btn-primary" onclick="buscarPorCodigo(document.getElementById('manualInput').value)">Add</button>
                        </div>
                    </div>
                    <div class="mt-2 small text-muted" id="statusCache">Estoque local: carregando...</div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="m-0">Carrinho (<span id="qtdItens">0</span>)</h5>
                        <div>
                            <!-- Novo botão de Atualizar -->
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="carregarEstoqueInicial()" title="Sincronizar Estoque">
                                🔄 Atualizar
                            </button>
                            <!-- Novo botão de Sair -->
                            <button class="btn btn-sm btn-outline-secondary me-1" onclick="sairDoSistema()">
                                Sair
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="limparCarrinho()">Limpar</button>
                        </div>
                    </div>
                    
                    <div id="listaCarrinho" class="carrinho-container"></div>
    
                    <div class="painel-pagamento mt-auto">
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="small fw-bold">Pagamento</label>
                                <select id="metodoPgto" class="form-select form-select-sm" onchange="ajustarCamposPagamento()">
                                    <option value="Pix">Pix</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                    <option value="Cartão Débito">Cartão Débito</option>
                                    <option value="Cartão Crédito">Cartão Crédito</option>
                                </select>
                            </div>
                            <div class="col-6" id="containerDinamico"></div>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="m-0 text-primary" id="totalExibicao">R$ 0,00</h4>
                            <button class="btn btn-success" onclick="enviarVenda()">Finalizar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwlrF8g7m9J44QRzPDMPbLeZcAT6nLL1i0lR4RcCZIZ0_rCdYedrwpLPkOLOAXb1sLe/exec"; 
    let carrinho = [];
    let estoqueLocal = [];
    let scanner;
    let ultimoCodigoLido = "";
    let timestampUltimaLeitura = 0;
    let vendedorLogado = "";

    function mostrarAviso(mensagem, tipo = 'success') {
        const container = document.getElementById('containerAvisos');
        const cor = tipo === 'success' ? 'success' : 'danger';
        container.innerHTML = `
            <div class="alert alert-${cor} shadow-lg text-center fw-bold" role="alert">
                ${mensagem}
            </div>
        `;
        setTimeout(() => { container.innerHTML = ''; }, 5000);
    }

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) { console.log("Áudio bloqueado."); }
    }

    // CORREÇÃO CIRÚRGICA: Função de saída unificada
    function sairDoSistema() {
        vendedorLogado = "";
        document.getElementById('vendedorAtivo').value = "";
        carrinho = [];
        atualizarInterface();

        // Para o scanner se estiver rodando
        if (scanner) {
            scanner.stop().catch(err => console.log("Erro ao parar scanner:", err));
        }

        // Sai da tela cheia se ainda estiver nela
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            if (document.exitFullscreen) {
                document.exitFullscreen().catch(err => console.log(err));
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            }
        }

        // Troca visual das telas
        document.getElementById('conteudoPrincipal').classList.add('oculto');
        document.getElementById('telaAcesso').classList.remove('oculto');
        
        // Remove o evento para não entrar em loop ao clicar em voltar na tela de login
        window.onpopstate = null;
    }

    async function carregarEstoqueInicial() {
        exibirLoader(true, "Sincronizando estoque...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ acao: 'carregarEstoque' })
            });
            const res = await response.json();
            if (res.sucesso) {
                estoqueLocal = res.lista.filter(item => item.codigo && item.codigo.trim() !== "");
                const totalPecas = estoqueLocal.reduce((acc, item) => acc + (Number(item.quantidade) || 0), 0);
                document.getElementById('statusCache').innerText = `Estoque local: ${totalPecas} peças.`;
                mostrarAviso("Estoque atualizado!");
            }
        } catch (e) { 
            mostrarAviso("Erro ao conectar com a planilha.", "error");
        } finally { exibirLoader(false); }
    }

    function iniciarScanner() {
        scanner = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        scanner.start({ facingMode: "environment" }, config, (text) => {
            processarLeitura(text);
        }).catch(err => console.error("Erro câmera:", err));
    }

    function processarLeitura(codigo) {
        const agora = Date.now();
        if (codigo === ultimoCodigoLido && (agora - timestampUltimaLeitura) < 3000) return;
        ultimoCodigoLido = codigo;
        timestampUltimaLeitura = agora;
        buscarPorCodigo(codigo);
    }

    async function buscarPorCodigo(codigo) {
        if (!codigo) return;
        codigo = codigo.trim();
        const produto = estoqueLocal.find(p => p.codigo === codigo);
        if (produto) {
            adicionarAoCarrinho(produto);
        } else {
            exibirLoader(true, "Buscando...");
            try {
                const response = await fetch(URL_API, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'buscarProduto', dados: { codigo: codigo } })
                });
                const res = await response.json();
                if (res.sucesso) { adicionarAoCarrinho(res); } 
                else { mostrarAviso("Não encontrado: " + codigo, 'error'); }
            } catch (e) { mostrarAviso("Erro de conexão.", 'error'); }
            finally { exibirLoader(false); }
        }
    }

    function adicionarAoCarrinho(produto) {
        playBeep();
        const itemExistente = carrinho.find(item => item.codigo === produto.codigo);
        if (itemExistente) { itemExistente.quantidade += 1; } 
        else { carrinho.push({ ...produto, quantidade: 1 }); }
        
        const readerDiv = document.getElementById('reader');
        readerDiv.style.border = "5px solid #28a745";
        setTimeout(() => readerDiv.style.border = "5px solid transparent", 400);
        
        atualizarInterface();
        document.getElementById('manualInput').value = "";
    }

    function atualizarInterface() {
        const lista = document.getElementById('listaCarrinho');
        let totalBruto = 0, totalPecas = 0;
        lista.innerHTML = "";
        carrinho.forEach((item, idx) => {
            const subtotal = item.preco * item.quantidade;
            totalBruto += subtotal;
            totalPecas += item.quantidade;
            lista.innerHTML += `
                <div class="card item-card shadow-sm">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="item-nome" style="flex: 1.5;"><strong>${item.nomeCombinado || item.nome}</strong></div>
                        <div class="text-center" style="flex: 0.5;"><span class="badge bg-primary">${item.quantidade}x</span></div>
                        <div class="d-flex align-items-center justify-content-end" style="flex: 1.5;">
                            <strong class="me-2">R$ ${subtotal.toFixed(2)}</strong>
                            <button class="btn btn-sm text-danger" onclick="removerUm(${idx})">✕</button>
                        </div>
                    </div>
                </div>`;
        });
        document.getElementById('qtdItens').innerText = totalPecas;
        const selectDesc = document.getElementById('desconto');
        const inputManual = document.getElementById('descontoManual');
        let percDesconto = (selectDesc && selectDesc.value === 'outro') ? (parseFloat(inputManual.value) || 0) / 100 : (parseFloat(selectDesc?.value) || 0);
        document.getElementById('totalExibicao').innerText = `R$ ${(totalBruto * (1 - percDesconto)).toFixed(2)}`;
    }

    function ajustarCamposPagamento() {
        const metodo = document.getElementById('metodoPgto').value;
        const container = document.getElementById('containerDinamico');
        if (metodo === 'Pix' || metodo === 'Dinheiro') {
            container.innerHTML = `<label class="small fw-bold">Desconto %</label>
                <div class="input-group input-group-sm">
                    <select id="desconto" class="form-select" onchange="verificarDescontoPersonalizado()">
                        <option value="0">0%</option><option value="0.02">2%</option><option value="0.05">5%</option><option value="outro">Outro</option>
                    </select>
                    <input type="number" id="descontoManual" class="form-control oculto" oninput="atualizarInterface()" style="max-width: 60px;">
                </div>`;
        } else if (metodo === 'Cartão Crédito') {
            container.innerHTML = `<label class="small fw-bold">Parcelas</label>
                <select id="parcelas" class="form-select form-select-sm">
                    <option value="1">1x</option><option value="2">2x</option><option value="3">3x</option>
                </select>`;
        } else { container.innerHTML = ''; }
        atualizarInterface();
    }

    function verificarDescontoPersonalizado() {
        const select = document.getElementById('desconto');
        document.getElementById('descontoManual').classList.toggle('oculto', select.value !== 'outro');
        atualizarInterface();
    }

    async function enviarVenda() {
        if (carrinho.length === 0) return mostrarAviso("Carrinho vazio!", 'error');
        exibirLoader(true, "Enviando...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ acao: 'finalizarVenda', dados: { venda: { vendedor: vendedorLogado }, itens: carrinho } })
            });
            const res = await response.json();
            if (res.sucesso) {
                mostrarAviso("SUCESSO!", 'success');
                limparCarrinho();
                await carregarEstoqueInicial();
            }
        } catch (e) { mostrarAviso("Erro conexão", 'error'); }
        finally { exibirLoader(false); }
    }

    function removerUm(idx) {
        if (carrinho[idx].quantidade > 1) carrinho[idx].quantidade--;
        else carrinho.splice(idx, 1);
        atualizarInterface();
    }

    function limparCarrinho() {
        carrinho = [];
        atualizarInterface();
    }

    function exibirLoader(show, texto = "") {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
        if(texto) document.getElementById('loaderText').innerText = texto;
    }

    async function iniciarSistema() {
        const nome = document.getElementById('vendedorAtivo').value.trim();
        if (!nome) return mostrarAviso("Informe seu nome", 'error');
        
        vendedorLogado = nome;
        
        const docElm = document.documentElement;
        try {
            if (docElm.requestFullscreen) await docElm.requestFullscreen();
            else if (docElm.webkitRequestFullscreen) await docElm.webkitRequestFullscreen();
        } catch (err) { console.log("Fullscreen negado"); }
    
        document.getElementById('telaAcesso').classList.add('oculto');
        document.getElementById('conteudoPrincipal').classList.remove('oculto');
        
        // ESTRATÉGIA DE DUPLO HISTÓRICO:
        // Criamos dois estados. O primeiro o navegador consome ao sair do Fullscreen.
        history.pushState({ step: 1 }, null, ""); 
        history.pushState({ step: 2 }, null, ""); 
    
        window.onpopstate = function (event) {
            // Se houver qualquer tentativa de voltar, encerramos tudo
            sairDoSistema();
        };
    
        await carregarEstoqueInicial();
        iniciarScanner();
        ajustarCamposPagamento();
        setTimeout(() => document.getElementById('manualInput').focus(), 500);
    }

    // Detecta quando o usuário sai do Fullscreen (seja pelo botão voltar ou gesto)
    function monitorarMudancaFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            // Se o vendedor ainda estiver logado mas saiu do Fullscreen, força a tela de login
            if (vendedorLogado !== "") {
                sairDoSistema();
            }
        }
    }
    
    // Registra o monitor para diferentes navegadores
    document.addEventListener('fullscreenchange', monitorarMudancaFullscreen);
    document.addEventListener('webkitfullscreenchange', monitorarMudancaFullscreen);
    
    // Eventos de Teclado Manual
    document.getElementById('manualInput').addEventListener('click', function() {
        this.removeAttribute('inputmode');
        this.focus();
    });
    document.getElementById('manualInput').addEventListener('blur', function() {
        this.setAttribute('inputmode', 'none');
    });

</script>
</body>
</html>

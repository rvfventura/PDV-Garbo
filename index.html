<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Profissional - Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; overflow-x: hidden; }
        
        #reader { 
            width: 100% !important;
            max-width: 400px; 
            border-radius: 8px;
        }

        .oculto { display: none !important; }
    
        @media (min-width: 768px) {
            .row.g-3 {
                min-height: 85vh; 
                align-items: stretch; 
            }
            
            .carrinho-container {
                flex-grow: 1; 
                height: calc(100vh - 420px); 
                min-height: 200px;
                overflow-y: auto;
            }
        }
    
        .painel-pagamento {
            background: #f1f3f5;
            padding: 10px; 
            border-radius: 8px;
            border-top: 2px solid #dee2e6;
            margin-top: 5px; 
        }
    
        .item-card { 
            border-left: 4px solid #0d6efd; 
            margin-bottom: 2px !important; 
            padding: 4px 10px !important; 
        }

        .item-card strong {
            white-space: nowrap !important;
        }
    
        .item-nome {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; 
            font-size: 0.85rem;
        }

        .item-tamanho {
            font-size: 0.75rem;
            color: #6c757d;
            font-weight: bold;
        }
    
        .loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center;
        }

        /* Estilo para a barra de avisos superior */
        #containerAvisos {
            position: fixed;
            top: 20px; /* Desci um pouco mais para não colar no topo */
            left: 50%;
            transform: translateX(-50%);
            z-index: 30000; /* Valor maior que a tela de acesso e loaders */
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

<!-- Espaço para Avisos (Sucesso/Erro) -->
<div id="containerAvisos"></div>

<div class="loading-overlay" id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <span class="ms-2" id="loaderText">Sincronizando Dados...</span>
</div>

<!-- Tela de Acesso -->
<div id="telaAcesso" class="d-flex justify-content-center align-items-center" style="position: fixed; top:0; left:0; width:100%; height:100%; background: #f8f9fa; z-index: 20000;">
    <div class="card shadow-lg p-4 text-center" style="max-width: 400px; width: 90%;">
        <h3 class="mb-4 text-primary">Acesso ao PDV GARBO</h3>
        <div class="mb-3 text-start">
            <label class="form-label fw-bold">Nome do Vendedor</label>
            <input type="text" id="vendedorAtivo" class="form-control form-control-lg" placeholder="Digite seu nome">
        </div>
        <button class="btn btn-primary btn-lg w-100 py-3" onclick="iniciarSistema()">
            ENTRAR E ATIVAR PDV ⛶
        </button>
        <p class="mt-3 text-muted small">O sistema será aberto em tela cheia.</p>
    </div>
</div>
    
<div class="container-fluid py-3 oculto" id="conteudoPrincipal">
    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100 d-flex align-items-center justify-content-center">
                <div class="card-body text-center w-100 d-flex flex-column justify-content-center">
                    <h5 class="card-title mb-3">Terminal de Leitura</h5>
                    <div id="reader" class="mx-auto"></div>
                    <div class="mt-3">
                        <div class="input-group input-group-sm mx-auto" style="max-width: 300px;">
                            <input type="text" id="manualInput" class="form-control" 
                               placeholder="Código manual" 
                               inputmode="none"
                               style="text-transform: uppercase;" 
                               oninput="this.value = this.value.toUpperCase()"
                               onkeydown="if(event.key === 'Enter') buscarPorCodigo(this.value)">
                            <button class="btn btn-primary" onclick="buscarPorCodigo(document.getElementById('manualInput').value)">Add</button>
                        </div>
                    </div>
                    <div class="mt-2 small text-muted" id="statusCache">Estoque local: carregando...</div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body d-flex flex-column p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 class="m-0">Carrinho (<span id="qtdItens">0</span>)</h5>
                        <div>
                            <!-- Novo botão de Atualizar -->
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="carregarEstoqueInicial()" title="Sincronizar Estoque">
                                🔄 Atualizar
                            </button>
                            <!-- Novo botão de Sair -->
                            <button class="btn btn-sm btn-outline-secondary me-1" onclick="sairDoSistema()">
                                Sair
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="limparCarrinho()">Limpar</button>
                        </div>
                    </div>
                    
                    <div id="listaCarrinho" class="carrinho-container"></div>
    
                    <div class="painel-pagamento mt-auto">
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="small fw-bold">Pagamento</label>
                                <select id="metodoPgto" class="form-select form-select-sm" onchange="ajustarCamposPagamento()">
                                    <option value="Pix">Pix</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                    <option value="Cartão Débito">Cartão Débito</option>
                                    <option value="Cartão Crédito">Cartão Crédito</option>
                                </select>
                            </div>
                            <div class="col-6" id="containerDinamico"></div>
                        </div>
                        
                        <div class="d-flex align-items-center gap-2 flex-nowrap">
                            <!-- O total agora tem 'flex-shrink-0' para garantir que não esprema -->
                            <h4 class="m-0 text-primary flex-shrink-0" id="totalExibicao" style="min-width: 100px;">R$ 0,00</h4>
                            
                            <button class="btn btn-warning fw-bold btn-sm w-100" onclick="abrirModalDesconto()">
                                % Desc
                            </button>
                            
                            <button class="btn btn-success fw-bold btn-sm w-100" onclick="enviarVenda()">
                                Finalizar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const URL_API = "https://script.google.com/macros/s/AKfycbwlrF8g7m9J44QRzPDMPbLeZcAT6nLL1i0lR4RcCZIZ0_rCdYedrwpLPkOLOAXb1sLe/exec";
    let carrinho = [];
    let estoqueLocal = [];
    let scanner;
    let ultimoCodigoLido = "";
    let timestampUltimaLeitura = 0;
    let vendedorLogado = "";
    function mostrarAviso(mensagem, tipo = 'success') {
        const container = document.getElementById('containerAvisos');
        const cor = tipo === 'success' ? 'success' : 'danger';
        container.innerHTML = `
            <div class="alert alert-${cor} shadow-lg text-center fw-bold animate__animated animate__fadeInDown" role="alert">
                ${mensagem}
            </div>`;
        setTimeout(() => { container.innerHTML = ''; }, 5000);
    }
    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) { console.log("Áudio bloqueado."); }
    }
    function sairDoSistema() {
        window.onpopstate = null;
        vendedorLogado = "";
        document.getElementById('vendedorAtivo').value = "";
        carrinho = [];
        atualizarInterface();
        
        // Tenta sair do Fullscreen se ainda estiver ativo
        if (document.fullscreenElement || document.webkitFullscreenElement) {
            const exitFS = document.exitFullscreen || document.webkitExitFullscreen;
            if (exitFS) exitFS.call(document).catch(err => console.log(err));
        }
        
        document.getElementById('conteudoPrincipal').classList.add('oculto');
        document.getElementById('telaAcesso').classList.remove('oculto');
    }
    
    async function carregarEstoqueInicial() {
        exibirLoader(true, "Sincronizando estoque...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ acao: 'carregarEstoque' })
            });
            const res = await response.json();
            if (res.sucesso) {
                estoqueLocal = res.lista.filter(item => item.codigo && item.codigo.trim() !== "");
                const totalPecas = estoqueLocal.reduce((acc, item) => acc + (Number(item.quantidade) || 0), 0);
                document.getElementById('statusCache').innerText =
                    `Estoque local: ${totalPecas} peças em ${estoqueLocal.length} modelos.`;
                mostrarAviso("Estoque atualizado com sucesso!");
            }
        } catch (e) {
            console.error("Erro cache:", e);
            mostrarAviso("Erro ao conectar com a planilha.", "error");
        } finally { exibirLoader(false); }
    }
    function iniciarScanner() {
        scanner = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        scanner.start({ facingMode: "environment" }, config, text => {
            processarLeitura(text);
        }).catch(err => console.error("Erro câmera:", err));
    }
    function processarLeitura(codigo) {
        const agora = Date.now();
        if (codigo === ultimoCodigoLido && (agora - timestampUltimaLeitura) < 3000) return;
        ultimoCodigoLido = codigo;
        timestampUltimaLeitura = agora;
        buscarPorCodigo(codigo);
    }
    async function buscarPorCodigo(codigo) {
        if (!codigo) return;
        codigo = codigo.trim();
        const produto = estoqueLocal.find(p => p.codigo === codigo);
        if (produto) {
            adicionarAoCarrinho(produto);
        } else {
            exibirLoader(true, "Buscando...");
            try {
                const response = await fetch(URL_API, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'buscarProduto', dados: { codigo: codigo } })
                });
                const res = await response.json();
                if (res.sucesso) adicionarAoCarrinho(res);
                else mostrarAviso("Produto não encontrado: " + codigo, 'error');
            } catch (e) {
                mostrarAviso("Erro de conexão ao buscar produto.", 'error');
            } finally { exibirLoader(false); }
        }
    }
    function ajustarCamposPagamento() {
        const metodo = document.getElementById('metodoPgto').value;
        const container = document.getElementById('containerDinamico');
        
        // Pix, Dinheiro e Débito agora têm o mesmo comportamento visual
        if (metodo === 'Cartão Crédito') {
            container.innerHTML = `
                <label class="small fw-bold">Parcelas</label>
                <select id="parcelas" class="form-select form-select-sm">
                    <option value="1">1x</option>
                    <option value="2">2x</option>
                    <option value="3">3x</option>
                    <option value="4">4x</option>
                    <option value="5">5x</option>
                </select>`;
        } else {
            // Para Pix, Dinheiro e Débito, não mostramos campos extras aqui, 
            // pois o desconto agora é um botão global.
            container.innerHTML = '<span class="badge bg-light text-dark">Pagamento à vista</span>';
        }
        atualizarInterface();
    }
    
    // No topo do script, certifique-se que esta variável existe
    let descontoGlobal = 0; 
    
    function abrirModalDesconto() {
        // Armazenamos o valor atual para mostrar como padrão no prompt
        const valorPadrao = (descontoGlobal * 100).toFixed(0);
        const entrada = prompt("Digite o desconto em % (0 a 100):", valorPadrao);
    
        // Se o usuário clicar em 'Cancelar', a variável 'entrada' será null.
        // Verificamos isso para não fazer nada e não disparar o popstate.
        if (entrada !== null) {
            const valorNumerico = parseFloat(entrada.replace(',', '.'));
            
            if (!isNaN(valorNumerico) && valorNumerico >= 0 && valorNumerico <= 100) {
                descontoGlobal = valorNumerico / 100;
                mostrarAviso(`Desconto de ${valorNumerico}% aplicado.`);
            } else {
                descontoGlobal = 0;
                mostrarAviso("Desconto removido ou valor inválido.", "error");
            }
            atualizarInterface();
        }
    }
        
    function adicionarAoCarrinho(produto) {
        playBeep();
        const itemExistente = carrinho.find(item => item.codigo === produto.codigo);
        if (itemExistente) {
            itemExistente.quantidade += 1;
        } else {
            carrinho.push({ ...produto, grandmother: 1, quantidade: 1 });
        }
        const readerDiv = document.getElementById('reader');
        readerDiv.style.border = "5px solid #28a745";
        setTimeout(() => readerDiv.style.border = "5px solid transparent", 400);
        atualizarInterface();
        document.getElementById('manualInput').value = "";
    }
    function atualizarInterface() {
        const lista = document.getElementById('listaCarrinho');
        let totalBruto = 0;
        let totalPecas = 0;
        lista.innerHTML = "";
        carrinho.forEach((item, idx) => {
            const subtotal = item.preco * item.quantidade;
            totalBruto += subtotal;
            totalPecas += item.quantidade;
            const tamanhoTexto = item.tamanho ? `<span class="item-tamanho"> | ${item.tamanho}</span>` : "";
            lista.innerHTML += `
                <div class="card item-card shadow-sm">
                    <div class="d-flex align-items-center justify-content-between">
                        <div class="item-nome" style="flex: 1.5;">
                            <strong>${item.nomeCombinado || item.nome}</strong>${tamanhoTexto}
                        </div>
                        <div class="text-center" style="flex: 0.5; font-size: 0.85rem;">
                            <span class="badge bg-primary">${item.quantidade}x</span>
                        </div>
                        <div class="d-flex align-items-center justify-content-end" style="flex: 1.5; min-width: 105px;">
                            <strong class="me-2" style="font-size: 0.9rem;">R$ ${subtotal.toFixed(2)}</strong>
                            <button class="btn btn-sm btn-outline-danger border-0 p-0 px-2" onclick="removerUm(${idx})">✕</button>
                        </div>
                    </div>
                </div>`;
        });
    
        document.getElementById('qtdItens').innerText = totalPecas;
    
        // MODIFICAÇÃO CIRÚRGICA: 
        // O cálculo agora ignora os elementos antigos e usa a variável global definida pelo novo botão.
        const valorComDesconto = totalBruto * (1 - (window.descontoGlobal || 0));
        
        document.getElementById('totalExibicao').innerText = `R$ ${valorComDesconto.toFixed(2)}`;
    }
    
    async function enviarVenda() {
    if (carrinho.length === 0) return mostrarAviso("O carrinho está vazio!", 'error');

    const metodo = document.getElementById('metodoPgto').value;
    const campoParc = document.getElementById('parcelas');
    
    // Define se é à vista ou parcelado
    let textoParcelas = (metodo === 'Cartão Crédito' && campoParc) ? (campoParc.value + "x") : "à vista";

    const payload = {
        acao: 'finalizarVenda',
        dados: {
            venda: {
                pagamento: metodo,
                desconto: (descontoGlobal * 100).toFixed(2) + "%", // Envia formatado como string
                parcelas: textoParcelas,
                vendedor: vendedorLogado
            },
            itens: carrinho
        }
    };
    exibirLoader(true, "Finalizando Venda...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            const res = await response.json();
            if (res.sucesso) {
                mostrarAviso("VENDA CONCLUÍDA COM SUCESSO!", 'success');
                limparCarrinho();
                await carregarEstoqueInicial();
            } else {
                mostrarAviso("Erro na planilha: " + res.erro, 'error');
            }
        } catch (e) {
            mostrarAviso("Erro de conexão com o servidor.", 'error');
        } finally { exibirLoader(false); }
    }
    function removerUm(idx) {
        if (carrinho[idx].quantidade > 1) carrinho[idx].quantidade -= 1;
        else carrinho.splice(idx, 1);
        atualizarInterface();
    }
    function limparCarrinho() {
        carrinho = [];
        document.getElementById('metodoPgto').value = "Pix";
        ajustarCamposPagamento();
        atualizarInterface();
        document.getElementById('manualInput').focus();
    }
    function exibirLoader(show, texto = "") {
        document.getElementById('loader').style.display = show ? 'flex' : 'none';
        if (texto) document.getElementById('loaderText').innerText = texto;
    }
    async function iniciarSistema() {
        const inputVendedor = document.getElementById('vendedorAtivo');
        const nomeInformado = inputVendedor.value.trim();
        if (!nomeInformado) {
            mostrarAviso("Por favor, informe seu nome para acessar o PDV.", 'error');
            inputVendedor.focus();
            return;
        }
        vendedorLogado = nomeInformado;
    
        const docElm = document.documentElement;
        try {
            // Tenta o método padrão e o prefixado para Android
            const requestFS = docElm.requestFullscreen || docElm.webkitRequestFullscreen;
            if (requestFS) await requestFS.call(docElm);
        } catch (err) {
            console.log("Acesso à tela cheia negado.");
        }
    
        document.getElementById('telaAcesso').classList.add('oculto');
        document.getElementById('conteudoPrincipal').classList.remove('oculto');
        
        gerenciarNavegaçãoAndroid();
        
        exibirLoader(true, "Iniciando sistema...");
        try {
            await carregarEstoqueInicial();
            iniciarScanner();
            ajustarCamposPagamento();
        } catch (e) {
            mostrarAviso("Erro ao carregar dados iniciais.", 'error');
        } finally {
            exibirLoader(false);
            setTimeout(() => document.getElementById('manualInput').focus(), 500);
        }
    }
    
    function gerenciarNavegaçãoAndroid() {
        // Adiciona uma entrada no histórico
        history.pushState({ pdvAtivo: true }, null, "");
    
        // Evento disparado quando o usuário clica em "Voltar"
        window.onpopstate = function () {
            if (vendedorLogado !== "") {
                sairDoSistema();
            }
        };
    
        // O PULO DO GATO: Monitora a saída do Fullscreen
        // Quando o 1º clique tirar o Fullscreen, ele chama o sairDoSistema()
        const mudarFS = () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (vendedorLogado !== "") {
                    sairDoSistema();
                }
            }
        };
    
        document.addEventListener('fullscreenchange', mudarFS);
        document.addEventListener('webkitfullscreenchange', mudarFS);
    }
    
    document.getElementById('manualInput').addEventListener('click', function () {
        this.removeAttribute('inputmode');
        this.focus();
    });
    document.getElementById('manualInput').addEventListener('blur', function () {
        this.setAttribute('inputmode', 'none');
    });
    
    // Se o usuário sair do Fullscreen por qualquer motivo, deslogamos por segurança
    const eventoFS = 'onwebkitfullscreenchange' in document ? 'webkitfullscreenchange' : 'fullscreenchange';
    document.addEventListener(eventoFS, () => {
        if (!document.fullscreenElement && !document.webkitFullscreenElement && vendedorLogado !== "") {
            sairDoSistema();
        }
    });
    
    window.onload = () => { console.log("Sistema pronto."); };
</script>

</body>
</html>

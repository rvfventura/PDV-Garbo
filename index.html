<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Profissional - Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    
    /* Configuração do Scanner */
    #reader { 
        width: 100%; 
        border-radius: 8px; 
        overflow: hidden; 
        background: #000; 
        border: 5px solid transparent; 
        transition: border 0.2s; 
    }

    /* Container do Carrinho */
    .carrinho-container { 
        max-height: 400px; 
        overflow-y: auto; 
    }

    .item-card { border-left: 4px solid #0d6efd; margin-bottom: 8px; }

    /* Tela de Carregamento */
    .loading-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center;
    }

    /* --- AJUSTES PARA TABLET (RESPONSIVIDADE) --- */

    /* Quando o Tablet estiver DEITADO (Horizontal) */
    @media (min-width: 992px) {
        .carrinho-container {
            height: 55vh; /* Aumenta a lista para aproveitar o espaço lateral */
            max-height: none;
        }
    }

    /* Quando o Tablet estiver EM PÉ (Vertical) */
    @media (max-width: 991px) {
        #reader {
            max-width: 500px; /* Evita que a câmera ocupe a tela inteira verticalmente */
            margin: 0 auto;
        }
    }
</style>
</head>
<body>

<div class="loading-overlay" id="loader">
    <div class="spinner-border text-primary" role="status"></div>
    <span class="ms-2" id="loaderText">Sincronizando Dados...</span>
</div>

<div class="container-fluid py-4">
    <div class="row g-3">
        <!-- Lado Esquerdo: Scanner -->
        <div class="col-12 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">Terminal de Leitura</h5>
                    <div id="reader"></div>
                    <div class="mt-3">
                        <div class="input-group">
                            <input type="text" id="manualInput" class="form-control" placeholder="Código manual">
                            <button class="btn btn-primary" onclick="buscarPorCodigo(document.getElementById('manualInput').value)">Add</button>
                        </div>
                    </div>
                    <div class="mt-2 small text-muted text-center" id="statusCache">
                        Estoque local: carregando...
                    </div>
                </div>
            </div>
        </div>

        <!-- Lado Direito: Carrinho -->
        <div class="col-12 col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="m-0">Carrinho de Compras</h5>
                        <div>
                            <button class="btn btn-sm btn-outline-secondary me-2" onclick="carregarEstoqueInicial()">🔄 Atualizar Preços</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="limparCarrinho()">Limpar</button>
                        </div>
                    </div>
                    
                    <div id="listaCarrinho" class="carrinho-container mb-3"></div>

                    <div class="bg-light p-3 rounded">
                        <div class="row g-2">
                            <div class="col-6">
                                <label class="small">Pagamento</label>
                                <select id="metodoPgto" class="form-select">
                                    <option value="Pix">Pix</option>
                                    <option value="Cartão Crédito">Cartão Crédito</option>
                                    <option value="Cartão Débito">Cartão Débito</option>
                                    <option value="Dinheiro">Dinheiro</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="small">Desconto (R$)</label>
                                <input type="number" id="desconto" class="form-control" value="0" oninput="atualizarInterface()">
                            </div>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between align-items-center">
                            <h3 class="m-0 text-primary" id="totalExibicao">R$ 0,00</h3>
                            <button class="btn btn-success btn-lg" onclick="enviarVenda()">Finalizar Venda</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const URL_API = "https://script.google.com/macros/s/AKfycbwRgKmPmxzeqXZeTRUAbIjIWsf-haaFTX4L97WhNnW-UZ6tnJhdtvu6qyXk07rvksjPpw/exec"; 
    let carrinho = [];
    let estoqueLocal = [];
    let scanner;
    
    let ultimoCodigoLido = "";
    let timestampUltimaLeitura = 0;

    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.1);
        } catch (e) { console.log("Áudio pendente de interação."); }
    }

    async function carregarEstoqueInicial() {
        exibirLoader(true, "Sincronizando Estoque...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ acao: 'carregarEstoque' })
            });
            const res = await response.json();
            if (res.sucesso) {
                estoqueLocal = res.lista;
                document.getElementById('statusCache').innerText = `Estoque local: ${estoqueLocal.length} produtos prontos.`;
            }
        } catch (e) {
            console.error("Erro cache:", e);
        } finally {
            exibirLoader(false);
        }
    }

    function iniciarScanner() {
        scanner = new Html5Qrcode("reader");
        const config = { fps: 15, qrbox: { width: 250, height: 250 } };
        
        scanner.start({ facingMode: "environment" }, config, (text) => {
            processarLeitura(text);
        }).catch(err => console.error("Erro câmera:", err));
    }

    function processarLeitura(codigo) {
        const agora = Date.now();
        if (codigo === ultimoCodigoLido && (agora - timestampUltimaLeitura) < 3000) return;
        ultimoCodigoLido = codigo;
        timestampUltimaLeitura = agora;
        buscarPorCodigo(codigo);
    }

    async function buscarPorCodigo(codigo) {
        if (!codigo) return;
        codigo = codigo.trim();
        const produto = estoqueLocal.find(p => p.codigo === codigo);

        if (produto) {
            adicionarAoCarrinho(produto);
        } else {
            exibirLoader(true, "Buscando...");
            try {
                const response = await fetch(URL_API, {
                    method: 'POST',
                    body: JSON.stringify({ acao: 'buscarProduto', dados: { codigo: codigo } })
                });
                const res = await response.json();
                if (res.sucesso) {
                    adicionarAoCarrinho(res);
                } else {
                    alert("Produto não encontrado: " + codigo);
                }
            } catch (e) {
                alert("Erro de conexão.");
            } finally {
                exibirLoader(false);
            }
        }
    }

    function adicionarAoCarrinho(produto) {
        playBeep();
        const itemExistente = carrinho.find(item => item.codigo === produto.codigo);

        if (itemExistente) {
            itemExistente.quantidade += 1;
        } else {
            carrinho.push({ ...produto, quantidade: 1 });
        }

        const readerDiv = document.getElementById('reader');
        readerDiv.style.border = "5px solid #28a745";
        setTimeout(() => readerDiv.style.border = "5px solid transparent", 400);

        atualizarInterface();
        document.getElementById('manualInput').value = "";
    }

    function atualizarInterface() {
        const lista = document.getElementById('listaCarrinho');
        let totalBruto = 0;
        lista.innerHTML = "";

        carrinho.forEach((item, idx) => {
            const subtotal = item.preco * item.quantidade;
            totalBruto += subtotal;
            
            lista.innerHTML += `
                <div class="card item-card shadow-sm p-2 mb-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div style="flex: 1;">
                            <strong class="d-block">${item.nomeCombinado || item.nome}</strong>
                            <span class="text-muted small">Cod: ${item.codigo} | R$ ${item.preco.toFixed(2)} un.</span>
                        </div>
                        <div class="d-flex align-items-center">
                            <div class="me-3 text-end">
                                <span class="badge bg-primary rounded-pill">x ${item.quantidade}</span>
                                <strong class="d-block mt-1">R$ ${subtotal.toFixed(2)}</strong>
                            </div>
                            <button class="btn btn-sm btn-outline-danger" onclick="removerUm(${idx})">-1</button>
                        </div>
                    </div>
                </div>`;
        });

        const desc = parseFloat(document.getElementById('desconto').value) || 0;
        document.getElementById('totalExibicao').innerText = `R$ ${(totalBruto - desc).toFixed(2)}`;
    }

    async function enviarVenda() {
        if (carrinho.length === 0) return alert("Carrinho vazio!");
        
        const infoVenda = {
            pagamento: document.getElementById('metodoPgto').value,
            desconto: parseFloat(document.getElementById('desconto').value) || 0,
            parcelas: 1
        };

        exibirLoader(true, "Finalizando Venda...");
        try {
            const response = await fetch(URL_API, {
                method: 'POST',
                body: JSON.stringify({ acao: 'finalizarVenda', dados: { venda: infoVenda, itens: carrinho } })
            });
            const res = await response.json();
            if (res.sucesso) {
                alert("Venda registrada!");
                limparCarrinho();
                await carregarEstoqueInicial();
            } else {
                alert("Erro: " + res.erro);
            }
        } catch (e) {
            alert("Erro de conexão.");
        } finally {
            exibirLoader(false);
        }
    }

    function removerUm(idx) {
        if (carrinho[idx].quantidade > 1) {
            carrinho[idx].quantidade -= 1;
        } else {
            carrinho.splice(idx, 1);
        }
        atualizarInterface();
    }

    function limparCarrinho() { carrinho = []; atualizarInterface(); }
    
    function exibirLoader(show, texto = "") { 
        document.getElementById('loader').style.display = show ? 'flex' : 'none'; 
        if(texto) document.getElementById('loaderText').innerText = texto;
    }

    window.onload = async () => {
        await carregarEstoqueInicial();
        iniciarScanner();
    };
</script>

</body>
</html>
